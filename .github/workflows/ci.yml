name: Test mcpx Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Check that the committed dist matches the source
        run: git diff --exit-code -- dist

  test-lint:
    name: Lint MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint DeepWiki (expect pass — fail-on errors)
        id: lint
        uses: sameenchand/mcpx@v1
        with:
          url: https://mcp.deepwiki.com/mcp
          fail-on: errors

      - name: Print outputs
        run: |
          echo "Grade  : ${{ steps.lint.outputs.grade }}"
          echo "Score  : ${{ steps.lint.outputs.score }}"
          echo "Errors : ${{ steps.lint.outputs.errors }}"
          echo "Warnings: ${{ steps.lint.outputs.warnings }}"

  test-min-grade:
    name: Min Grade Gate (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with min-grade B (DeepWiki is B — expect pass)
        uses: sameenchand/mcpx@v1
        with:
          url: https://mcp.deepwiki.com/mcp
          min-grade: B

  test-token-budget:
    name: Token Budget Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with token-budget 5000 (263 tokens — expect pass)
        uses: sameenchand/mcpx@v1
        with:
          url: https://mcp.deepwiki.com/mcp
          token-budget: 5000
