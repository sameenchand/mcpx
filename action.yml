name: MCP Schema Lint
description: Lint an MCP server schema and fail CI on quality regressions
author: sameenchand

inputs:
  url:
    description: MCP server URL to lint. Set this or `command`.
    required: false
  command:
    description: Command that starts a stdio MCP server in the workspace, for example `node dist/server.js`. Set this or `url`.
    required: false
  headers:
    description: 'HTTP headers to send, one "Name: value" per line. Use secrets for tokens.'
    required: false
  timeout:
    description: Seconds to wait for the server to connect
    required: false
  remote:
    description: Set to "true" to run through the hosted MCP Playground API instead of connecting from the runner
    default: "false"
  fail-on:
    description: "Fail on: errors (default) or warnings"
    default: errors
  min-grade:
    description: "Fail if grade is below threshold (A, B, C, D, F)"
    required: false
  token-budget:
    description: Max allowed token footprint
    required: false

outputs:
  grade:
    description: Letter grade (A–F)
  score:
    description: Numeric score (0–100)
  errors:
    description: Number of errors found
  warnings:
    description: Number of warnings found

runs:
  using: node24
  main: dist/action.js
